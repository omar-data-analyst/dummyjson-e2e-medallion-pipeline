name: Medallion E2E Pipeline Automation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-etl-pipelines:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    # 1. سحب كود المشروع
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة بايثون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. إعداد Java 17
    - name: Set up Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas google-cloud-bigquery pyspark pyarrow pandas-gbq
      
    # 5. المصادقة الآمنة مع Google Cloud
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/191157402123/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-sa@dummyjson-e2e-pipeline.iam.gserviceaccount.com'

    # Check Quality for Fact_Order_vw
    - name: Run Data Quality Checks on BigQuery Gold Views
      env:
        GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        BQ_GOLD_DATASET: gold
        GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
      run: |
        python scripts/data_quality_checks.py "${{ steps.set_date.outputs.today_date }}"

