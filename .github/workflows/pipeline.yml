name: Medallion E2E Pipeline Automation

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  run-etl-pipelines:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # تم التحديث إلى الإصدار v5 لتجنب التحذير
    - name: Set up Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas google-cloud-bigquery pyspark

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/191157402123/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
        service_account: 'github-actions-sa@dummyjson-e2e-pipeline.iam.gserviceaccount.com'

    - name: Run Currency Pipeline
      run: python src/currency_data_processing.py
